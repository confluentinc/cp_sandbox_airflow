# Minimal single-container Airflow for trying the file_to_kafka DAG.
#   docker compose up -d --build
# Create .env from .env.example first. To map broker host names that only resolve on your
# machine, copy docker-compose.override.example.yml to docker-compose.override.yml.
services:
  airflow:
    build: .
    command: standalone
    env_file: .env
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - airflow-home:/opt/airflow
      - ./dags:/opt/airflow/dags
      - ./input:/opt/airflow/input:ro

volumes:
  airflow-home:
